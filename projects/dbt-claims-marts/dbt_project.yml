name: claims_marts
version: "1.0.0"
config-version: 2
profile: claims_marts

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  # The same synthetic Synthea files the Azure lakehouse project ingests.
  synthea_dir: "../azure-lakehouse/sample_data/synthea"
  max_quarantine_ratio: 0.05

models:
  claims_marts:
    staging:
      +materialized: view
    marts:
      +materialized: table

tests:
  claims_marts:
    +store_failures: true   # failing rows land in a table you can query, like a quarantine

# Local stack: Kafka (KRaft, no ZooKeeper) + Redis + feature consumer + serving API.
#   docker compose -f infra/docker-compose.yml up -d --build
#   docker compose -f infra/docker-compose.yml exec consumer python scripts/produce_events.py --bootstrap kafka:29092
# Snowflake is optional: without FS_SF_ACCOUNT the consumer keeps working online-only
# and buffers offline rows (see README).
services:
  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  redis:
    image: redis:7.2-alpine
    ports: ["6379:6379"]
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru

  consumer:
    build: ..
    depends_on: [kafka, redis]
    environment:
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FS_SF_ACCOUNT: ${FS_SF_ACCOUNT:-}
      FS_SF_USER: ${FS_SF_USER:-}
      FS_SF_PASSWORD: ${FS_SF_PASSWORD:-}
    command: python -m ingestion.consumer
    restart: on-failure

  feature-api:
    build: ..
    ports: ["8001:8001"]
    depends_on: [redis]
    environment:
      REDIS_HOST: redis

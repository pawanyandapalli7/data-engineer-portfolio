# Repo-wide lint settings. Each project keeps its own requirements file.
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["**/sample_data/**", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
  "E731",   # small lambdas used as helpers in tests / sample generator
  "B008",   # FastAPI's File(...) default is idiomatic
  "B905",   # zip() over sequences that are equal-length by construction
  "UP006", "UP007", "UP035", "UP045",  # keep typing.Optional/List where 3.10-era code uses them
]

[tool.ruff.lint.isort]
known-first-party = [
  "lakehouse", "cdc_merge_job", "validations", "ingest", "query", "pricing", "api",
  "evaluator", "retrieval_metrics", "ingestion", "serving", "data_processing",
  "quality", "transformations", "lambda_s3_trigger", "src", "claims_model", "evidence",
]
